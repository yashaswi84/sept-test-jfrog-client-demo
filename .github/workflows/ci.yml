name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  BUILD_NAME: sept-test-jfrog-client-demo
  JF_NPM_RESOLVE: sept-test-npm
  JF_NPM_DEPLOY: sept-test-npm-local

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ secrets.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

      - name: Configure npm with Artifactory
        run: |
          rm -f package-lock.json npm-shrinkwrap.json .npmrc
          jf npm-config \
            --repo-resolve="${{ env.JF_NPM_RESOLVE }}" \
            --repo-deploy="${{ env.JF_NPM_DEPLOY }}" \
            --server-id-resolve=setup-jfrog-cli-server \
            --server-id-deploy=setup-jfrog-cli-server
      - name: Bump unique publish version
        if: github.event_name != 'pull_request'
        run: |
          npm version "1.0.${{ github.run_number }}" --no-git-tag-version

      - name: Install dependencies via Artifactory
        run: |
          jf npm install \
            --build-name="${{ env.BUILD_NAME }}" \
            --build-number="${{ github.run_number }}"

      - name: Run tests
        run: npm test

      - name: SCA audit
        continue-on-error: true
        run: jf audit --npm --format=table --extended-table

      - name: JAS audit (SAST / Secrets / IaC)
        continue-on-error: true
        run: jf audit --npm --secrets --sast --iac --format=table

      - name: Publish package to Artifactory
        if: github.event_name != 'pull_request'
        run: |
          jf npm publish \
            --build-name="${{ env.BUILD_NAME }}" \
            --build-number="${{ github.run_number }}"

      - name: Collect env + git and publish build-info
        if: github.event_name != 'pull_request'
        run: |
          jf rt bce "${{ env.BUILD_NAME }}" "${{ github.run_number }}"
          jf rt bag "${{ env.BUILD_NAME }}" "${{ github.run_number }}" || true
          jf rt bp "${{ env.BUILD_NAME }}" "${{ github.run_number }}"

      - name: Build scan
        if: github.event_name != 'pull_request'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          jf build-scan "${{ env.BUILD_NAME }}" "${{ github.run_number }}" \
            --fail=false --trigger-scan-retries=3
